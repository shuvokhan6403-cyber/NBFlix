<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBFlix</title><style>
:root{--bg:#07080d;--panel:#10121a;--text:#f7f8fb;--muted:#9ba1b2;--accent:#ff315c;--line:#242838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.nav{height:70px;display:flex;align-items:center;padding:0 6%;gap:20px;background:#10121a;position:sticky;top:0}.logo{font-size:25px;font-weight:900}.logo b{color:var(--accent)}input{margin-left:auto;background:#151823;border:1px solid var(--line);border-radius:999px;padding:11px;color:white;width:230px}.hero{padding:75px 6%;min-height:350px;background:radial-gradient(circle at 75% 20%,#652033,#07080d 65%)}h1{font-size:clamp(40px,6vw,70px);margin:10px 0}.wrap{padding:35px 6%}.head{margin-bottom:18px;font-size:22px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid #242838;border-radius:13px;overflow:hidden}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#202334}.body{padding:12px}.title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:5px}.status{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px}@media(max-width:950px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}input{width:155px}.wrap{padding:28px 4%}}
</style></head><body><nav class="nav"><div class="logo">NB<b>Flix</b></div><input id="search" placeholder="Search movies & series…"></nav><section class="hero"><div style="color:#ff8aa1;font-weight:bold">NBFLIX</div><h1>Watch what moves you.</h1><p>Explore movie and series information, posters and ratings.</p></section><main class="wrap"><div class="head">Trending now</div><div class="grid" id="grid"><div class="status">Loading titles…</div></div></main><footer style="padding:25px 6%;color:#888">© 2026 NBFlix • Movie information and images by TMDB. Not endorsed or certified by TMDB.</footer><script>
const grid=document.querySelector('#grid'),search=document.querySelector('#search');let titles=[];const base='https://image.tmdb.org/t/p/w500';function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function draw(arr){grid.innerHTML='';if(!arr.length){grid.innerHTML='<div class="status">No titles found.</div>';return;}arr.forEach(x=>{let n=x.title||x.name||'Untitled',yr=(x.release_date||x.first_air_date||'').slice(0,4),kind=x.media_type==='tv'?'Series':'Movie',c=document.createElement('article');c.className='card';c.innerHTML=(x.poster_path?`<img class="poster" loading="lazy" alt="${safe(n)} poster" src="${base+x.poster_path}">`:'<div class="poster"></div>')+`<div class="body"><div class="title">${safe(n)}</div><div class="sub">${safe([yr,kind,x.vote_average?'★ '+Number(x.vote_average).toFixed(1):''].filter(Boolean).join(' • '))}</div></div>`;grid.appendChild(c);});}async function load(){try{let r=await fetch('/.netlify/functions/tmdb?endpoint=%2Ftrending%2Fall%2Fweek');if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();titles=(d.results||[]).filter(x=>['movie','tv'].includes(x.media_type));draw(titles);}catch(e){grid.innerHTML='<div class="status">Could not load titles. Check the Netlify function and TMDB_API_KEY, then redeploy.</div>';console.error(e);}}search.addEventListener('input',()=>{let q=search.value.toLowerCase().trim();draw(titles.filter(x=>(x.title||x.name||'').toLowerCase().includes(q)));});load();
</script></body></html>
