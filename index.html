<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d"><meta name="description" content="Discover movies and series on NBFlix.">
<title>NBFlix — Movies, Series & Trailers</title>
<link rel="preconnect" href="https://image.tmdb.org"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--panel:#10121a;--panel2:#171a24;--text:#f7f7fa;--muted:#9298a8;--red:#ff315c;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}
.nav{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:22px;background:rgba(7,8,13,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font-size:27px;font-weight:900;letter-spacing:-1.5px;color:#fff;text-decoration:none}.logo span{color:var(--red)}.search{position:relative;max-width:430px;flex:1}.search input{width:100%;padding:13px 18px 13px 44px;border:1px solid var(--line);border-radius:13px;background:#11131b;color:white;outline:none}.search input:focus{border-color:var(--red)}.search:before{content:"⌕";position:absolute;left:16px;top:7px;font-size:25px;color:var(--muted)}
.hero{position:relative;min-height:380px;padding:45px 5%;display:flex;align-items:center;gap:35px;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 80% 30%,rgba(255,49,92,.16),transparent 45%),linear-gradient(110deg,#0b0c12,#07080d)}.hero-copy{max-width:570px;position:relative;z-index:1;flex:1}.eyebrow{color:var(--red);font-weight:800;font-size:11px;letter-spacing:3px;text-transform:uppercase}.hero h1{font-size:clamp(38px,5.5vw,65px);line-height:1.04;letter-spacing:-3px;margin:15px 0}.hero p{color:#b0b4c0;line-height:1.7;max-width:560px}.hero-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 19px;font-weight:800;background:var(--red);color:white}.btn.secondary{background:#ffffff12;border:1px solid var(--line);text-decoration:none;display:inline-block}
.feature-player{width:min(390px,42%);flex-shrink:0;background:#10121a;border:1px solid #ffffff16;border-radius:15px;overflow:hidden;box-shadow:0 18px 50px #0008;z-index:1}.feature-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;font-size:11px;font-weight:800}.live-dot{color:#ff647f}.feature-video{aspect-ratio:16/9;background:#05060a;position:relative}.feature-video iframe{width:100%;height:100%;border:0}.feature-caption{padding:10px 13px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-strip{padding:14px 5%;background:#0d0f16;border-bottom:1px solid var(--line);overflow:hidden}.top-strip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top-strip-head strong{font-size:13px}.top-strip-head span{font-size:10px;color:var(--muted)}.ticker-window{overflow:hidden}.ticker-track{display:flex;gap:11px;width:max-content;animation:nbTicker 48s linear infinite}.ticker-window:hover .ticker-track{animation-play-state:paused}.ticker-item{width:70px;flex-shrink:0;text-align:center;cursor:pointer}.ticker-item img{width:70px;height:94px;object-fit:cover;border-radius:8px;background:#171a24;display:block}.ticker-item div{font-size:9px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@keyframes nbTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{max-width:1600px;margin:auto;padding:30px 5% 65px}.tabs{display:flex;gap:9px;overflow:auto;padding:4px 0 16px;margin-bottom:20px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#10121a;color:#c8cad2;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700}.tab.active,.tab:hover{background:var(--red);border-color:var(--red);color:white}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:17px}.section-head h2{font-size:22px;margin:0;letter-spacing:-.7px}.section-head small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}.card{min-width:0;cursor:pointer;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid transparent;transition:.22s}.card:hover{transform:translateY(-4px);border-color:#ffffff28;box-shadow:0 16px 35px #0008}.poster{aspect-ratio:2/3;position:relative;background:#151722;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.rating{position:absolute;top:8px;right:8px;background:#08090ddf;border:1px solid #ffffff1c;border-radius:7px;padding:5px 7px;font-size:10px;font-weight:800;color:#ffd166}.kind{position:absolute;left:8px;bottom:8px;background:var(--red);padding:4px 7px;border-radius:5px;font-size:9px;font-weight:900;text-transform:uppercase}.card-info{padding:11px}.card-title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--muted);margin-top:6px}.state{grid-column:1/-1;text-align:center;padding:55px 15px;color:var(--muted)}.spinner{width:28px;height:28px;border:3px solid #ffffff20;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.load-wrap{text-align:center;padding:28px 0 8px}.load-btn{border:0;border-radius:11px;padding:13px 27px;background:var(--red);color:#fff;font-weight:800}.load-btn:disabled{opacity:.55;cursor:wait}
.modal{position:fixed;inset:0;z-index:50;background:#000d;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#10121a;border:1px solid var(--line);border-radius:18px;position:relative}.close{position:sticky;float:right;right:12px;top:10px;z-index:4;border:0;border-radius:50%;width:36px;height:36px;background:#000c;color:white;font-size:22px;margin:10px}.detail-top{display:grid;grid-template-columns:180px 1fr;gap:22px;padding:22px 26px 20px}.detail-top img{width:100%;border-radius:12px}.detail-copy h2{margin:4px 0 10px;font-size:26px}.detail-copy p{color:#b4b7c2;line-height:1.65;font-size:13px}.detail-meta{color:var(--muted);font-size:12px;margin-bottom:12px}
.player-tabs{display:flex;gap:8px;padding:0 26px 15px;overflow-x:auto}.p-tab{background:#171a24;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:11px;font-weight:700}.p-tab.active{background:var(--red);color:white;border-color:var(--red)}
.series-ui{display:none;gap:12px;padding:0 26px 15px}.s-select{background:#171a24;color:white;border:1px solid var(--line);padding:6px 10px;border-radius:6px;font-size:12px;outline:none}
.trailer{aspect-ratio:16/9;background:#05060a;max-width:850px;margin:0 auto 22px}.trailer iframe{width:100%;height:100%;border:0}.trailer-label{padding:0 26px 10px;color:#fff;font-size:13px;font-weight:800}.footer{border-top:1px solid var(--line);padding:24px 5%;color:var(--muted);font-size:12px;text-align:center}.footer a{color:#c9cbd3}
@media(max-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.hero{gap:20px}.feature-player{width:38%}}@media(max-width:780px){.hero{align-items:flex-start;flex-direction:column;padding:40px 5%;gap:20px}.hero-copy{max-width:none}.feature-player{width:100%;max-width:480px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.nav{height:auto;min-height:65px;padding:11px 4%;flex-wrap:wrap}.logo{font-size:23px}.search{order:3;flex-basis:100%;max-width:none}.hero{padding:36px 4%;min-height:0}.hero h1{letter-spacing:-1.8px}.top-strip{padding:13px 4%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}main{padding:23px 4% 48px}.detail-top{grid-template-columns:92px 1fr;gap:13px;padding:16px}.detail-copy h2{font-size:19px}.detail-copy p{font-size:12px}.section-head h2{font-size:19px}.trailer-label{padding:0 16px 9px}.player-tabs,.series-ui{padding:0 16px 12px}}
</style>
</head>
<body>

<header class="nav">
    <a class="logo" href="/">NB<span>Flix</span></a>
    <div class="search">
        <input type="text" id="searchInput" placeholder="Search movies or series...">
    </div>
</header>

<section class="hero">
    <div class="hero-copy">
        <div class="eyebrow">Spotlight Feature</div>
        <h1 id="heroTitle">Loading Spotlight...</h1>
        <p id="heroDesc">Fetching data matrix directly from the TMDB cloud storage engine...</p>
        <div class="hero-actions">
            <button class="btn" id="heroPlayBtn">⚡ Stream Spotlight</button>
            <a class="btn secondary" href="#mainContent">Browse Grid</a>
        </div>
    </div>
    <div class="feature-player">
        <div class="feature-head">
            <div>📺 LIVE PREVIEW</div>
            <div class="live-dot">● ONLINE</div>
        </div>
        <div class="feature-video">
            <iframe id="featureIframe" allowfullscreen></iframe>
        </div>
        <div class="feature-caption" id="featureCaption">Loading Trailer Feed...</div>
    </div>
</section>

<div class="top-strip">
    <div class="top-strip-head">
        <strong>🔥 Live Trending Feed</strong>
        <span>HOVER TO PAUSE</span>
    </div>
    <div class="ticker-window">
        <div class="ticker-track" id="tickerTrack"></div>
    </div>
</div>

<main id="mainContent">
    <div class="tabs">
        <button class="tab active" onclick="switchCategory('all', this)">🌐 All Trending</button>
