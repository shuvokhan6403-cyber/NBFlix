<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#040508">
<title>NBFlix - Elite Cinematic Streaming</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%230b0b0b'/%3E%3Ctext x='50' y='65' font-size='42' font-weight='900' text-anchor='middle' fill='%23ff003c'%3ENB%3C/text%3E%3C/svg%3E">

<!-- Google Fonts for Unique Luxury Typography -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
<!-- FontAwesome Premium Icons -->
<link rel="stylesheet" href="https://cloudflare.com">

<style>
:root {
  --bg-dark: #040508;
  --surface: #0c0e14;
  --surface-glow: #131722;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --primary-red: #ff003c;
  --red-glow: rgba(255, 0, 60, 0.4);
  --border-line: rgba(255, 255, 255, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* =========================
   EXCLUSIVE NAVBAR
========================= */
.app-nav {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  background: rgba(4, 5, 8, 0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border-line);
}

.brand-logo {
  font-family: 'Unbounded', sans-serif;
  font-size: 30px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -1.5px;
  color: #fff;
  text-decoration: none;
  transition: transform 0.3s ease;
}
.brand-logo span { color: var(--primary-red); text-shadow: 0 0 20px var(--red-glow); }
.brand-logo:hover { transform: scale(1.02); }

.search-container {
  position: relative;
  width: 350px;
}
.search-container input {
  width: 100%;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-line);
  border-radius: 16px;
  padding: 14px 20px 14px 54px;
  color: #fff;
  outline: none;
  font-size: 14px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.search-container input:focus {
  border-color: var(--primary-red);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 25px var(--red-glow);
}
.search-container i {
  position: absolute;
  left: 22px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
  transition: color 0.3s;
}
.search-container input:focus + i { color: var(--primary-red); }

/* =========================
   CINEMATIC HERO IMMERSION
========================= */
.hero-scope {
  position: relative;
  padding: 50px 6% 40px;
  border-bottom: 1px solid var(--border-line);
}
.hero-wrapper {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 60px;
  align-items: center;
}
@media (max-width: 1024px) {
  .hero-wrapper { grid-template-columns: 1fr; gap: 40px; }
  .cinema-preview-box { justify-self: center !important; }
}

.hero-info-panel .tagline {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: var(--primary-red);
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-info-panel h1 {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(34px, 4.5vw, 56px);
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: -2px;
  margin-bottom: 22px;
  background: linear-gradient(to right, #fff 40%, var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-info-panel p {
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.75;
  max-width: 620px;
}

/* UNIQUE LIVE ACTION THEATER PANEL */
.cinema-preview-box {
  width: 100%;
  max-width: 420px;
  justify-self: end;
  background: var(--surface);
  border: 1px solid var(--border-line);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 30px 70px rgba(0,0,0,0.6);
}
.cp-header {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.01);
  border-bottom: 1px solid var(--border-line);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text-muted);
}
.live-stream-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--primary-red);
}
.live-stream-badge span {
  width: 6px;
  height: 6px;
  background: var(--primary-red);
  border-radius: 50%;
  animation: pulseNode 1.8s infinite;
}
@keyframes pulseNode { 0% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.2; transform: scale(0.9); } }

.cp-screen {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #020203;
}
.cp-screen iframe { width: 100%; height: 100%; border: 0; display: none; }
.cp-loader {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 13px;
  background: linear-gradient(145deg, #0f121d 0%, #040508 100%);
}
.cp-footer { padding: 18px; }
#previewTitle { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
#previewMeta { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

/* =========================
   NAVIGATION SCROLL & CATALOG
========================= */
.content-shelf { padding: 50px 6%; max-width: 1550px; margin: 0 auto; }
.category-rack {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 16px;
  margin-bottom: 40px;
  scrollbar-width: none;
}
.category-rack::-webkit-scrollbar { display: none; }
.category-btn {
  background: rgba(255, 255, 255, 0.02);
  color: var(--text-main);
  border: 1px solid var(--border-line);
  padding: 14px 24px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.category-btn:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.15);
}
.category-btn.active {
  background: var(--primary-red);
  border-color: var(--primary-red);
  box-shadow: 0 8px 25px var(--red-glow);
}

.shelf-control {
  margin-bottom: 30px;
}
.shelf-heading { font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

/* =========================
   PLATFORM MOVIE GRID
========================= */
.dynamic-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 30px;
}
@media (max-width: 1300px) { .dynamic-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 850px) { .dynamic-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 580px) { .dynamic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }

.luxury-card {
  background: var(--surface);
  border: 1px solid var(--border-line);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: all 0.35s cubic-bezier(0.215, 0.610, 0.355, 1);
}
.luxury-card:hover {
  transform: translateY(-10px) scale(1.02);
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow: 0 20px 40px rgba(0,0,0,0.7);
}

.card-media-box {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  overflow: hidden;
  background: #0f121a;
}
.card-media-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
.luxury-card:hover .card-media-box img { transform: scale(1.06); }

/* Play Glow Overlay */
.glow-action-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(4, 5, 8, 0.8) 0%, rgba(4, 5, 8, 0.2) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.luxury-card:hover .glow-action-overlay { opacity: 1; }
.luxury-play-btn {
  width: 50px;
  height: 50px;
  background: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg-dark);
  font-size: 16px;
  box-shadow: 0 10px 30px rgba(255, 255, 255, 0.4);
  transform: scale(0.85);
  transition: all 0.3s ease;
}
.luxury-card:hover .luxury-play-btn { transform: scale(1); }
.luxury-play-btn:hover { background: var(--primary-red); color: #fff; box-shadow: 0 10px 30px var(--primary-red); }

.tag-rating {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(4, 5, 8, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-line);
  padding: 5px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #ffb800;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 2;
}
.tag-dimension {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: var(--primary-red);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  z-index: 2;
}

.card-description-panel { padding: 16px; background: var(--surface); }
.card-main-title { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; justify-content: space-between; }

.status-panel-msg { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 60px 0; font-size: 15px; }
