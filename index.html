<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06070d">
<title>NBFlix - Premium Cinema Platform</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0b0b'/%3E%3Ctext x='50' y='65' font-size='42' font-weight='bold' text-anchor='middle' fill='%23e50914'%3ENB%3C/text%3E%3C/svg%3E">

<!-- FontAwesome Icons for Premium Look -->
<link rel="stylesheet" href="https://cloudflare.com">

<style>
:root {
  --bg: #06070d;
  --panel: #0f111a;
  --panel-hover: #151824;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #e50914;
  --accent-glow: rgba(229, 9, 20, 0.35);
  --border: rgba(255, 255, 255, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Premium Dynamic Background Blur */
.bg-glow {
  position: absolute;
  top: -100px;
  right: -10px;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(229, 9, 20, 0.12) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

/* =========================
   NAVBAR & LOGO Style
========================= */
.navbar {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  background: rgba(6, 7, 13, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}

.logo-text {
  font-size: 28px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -1px;
  color: #fff;
  text-decoration: none;
}
.logo-text span { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

.search-box {
  position: relative;
  width: 320px;
}
.search-box input {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 12px 20px 12px 50px;
  color: #fff;
  outline: none;
  font-size: 14px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.search-box input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: 0 0 20px var(--accent-glow);
}
.search-box i {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 16px;
  transition: color 0.3s;
}
.search-box input:focus + i { color: var(--accent); }

/* =========================
   HERO BANNER
========================= */
.hero {
  position: relative;
  padding: 60px 6% 40px;
  border-bottom: 1px solid var(--border);
}
.hero-container {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 50px;
  align-items: center;
}
@media (max-width: 968px) {
  .hero-container { grid-template-columns: 1fr; gap: 30px; }
  .mini-trailer { justify-self: center !important; }
}
.hero-tag {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--accent);
  margin-bottom: 15px;
}
.hero h1 {
  font-size: clamp(36px, 5vw, 62px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -2px;
  margin-bottom: 20px;
}
.hero p {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
  max-width: 600px;
}

/* MINI TRAILER PANEL */
.mini-trailer {
  width: 100%;
  max-width: 400px;
  justify-self: end;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}
.mt-head {
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--muted);
}
.mt-pulse {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
}
.mt-pulse span {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

.mt-screen {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
}
.mt-screen iframe { width: 100%; height: 100%; border: 0; display: none; }
.mt-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 13px;
  background: linear-gradient(135deg, #111422 0%, #06070d 100%);
}
.mt-body { padding: 16px; }
#mtTitle { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mtMeta { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* =========================
   MAIN WRAPPER & TABS
========================= */
.main-content { padding: 40px 6%; max-width: 1500px; margin: 0 auto; }
.tabs-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 15px;
  margin-bottom: 30px;
  scrollbar-width: none;
}
.tabs-scroll::-webkit-scrollbar { display: none; }
.tab-link {
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s ease;
}
.tab-link:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
}
.tab-link.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.section-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

/* =========================
   PREMIUM MOVIE GRID
========================= */
.movie-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 25px;
}
@media (max-width: 1200px) { .movie-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 768px) { .movie-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; } }

.movie-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.movie-card:hover {
  transform: translateY(-8px);
  border-color: rgba(255,255,255,0.2);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

.poster-box {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  overflow: hidden;
  background: #141724;
}
.poster-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.movie-card:hover .poster-box img { transform: scale(1.08); }

/* Play Button Glow Overlay on Hover */
.play-overlay {
  position: absolute;
  inset: 0;
  background: rgba(6, 7, 13, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.movie-card:hover .play-overlay { opacity: 1; }
.play-icon-glow {
  width: 55px;
  height: 55px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  box-shadow: 0 0 25px var(--accent);
  transform: scale(0.8);
  transition: transform 0.3s ease;
}
.movie-card:hover .play-icon-glow { transform: scale(1); }

.badge-rating {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(15, 17, 26, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  padding: 6px 9px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  color: #ffb800;
  display: flex;
  align-items: center;
  gap: 4px;
}
.badge-type {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.card-details { padding: 14px; }
.card-title { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; align-items: center; gap: 8px; }

.status-msg { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 50px 0; font-size: 16px; }

/* Load More Button Style */
.btn-container { text-align: center; padding: 40px 0 20px; }
.load-btn {
  background: transparent;
  color: #fff;
  border: 1px solid var(--border);
  padding: 14px 36px;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}
.load-btn:hover {
  background: #fff;
  color: var(--bg);
  border-color: #fff;
  box-shadow: 0 0 30px rgba(255,255,255,0.2);
}

/* =========================
   LIGHTBOX VIDEO PLAYER
========================= */
.player-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(4, 5, 9, 0.96);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.player-lightbox.active { display: flex; }
.player-shell {
  width: min(1000px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8);
}
.player-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}
