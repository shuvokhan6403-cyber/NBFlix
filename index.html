<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080910">
<title>NBBox Pro — Discover Movies & Series</title>
<link rel="preconnect" href="https://image.tmdb.org">
<style>
:root{--bg:#080910;--panel:#11131e;--panel2:#171a28;--text:#f4f5f9;--muted:#9ba2b5;--red:#e50914;--gold:#ffbd35}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
header{height:70px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#0b0c14eF;border-bottom:1px solid #ffffff12;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.logo{font-size:25px;font-weight:900;color:var(--red);letter-spacing:.5px;cursor:pointer}.logo span{color:#fff}
.search{width:min(310px,55vw);background:#171925;border:1px solid #ffffff20;color:#fff;padding:11px 15px;border-radius:22px;outline:none}
.hero{height:450px;position:relative;background:#151725 center/cover no-repeat;display:flex;align-items:flex-end;margin-bottom:28px}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,#080910aa 48%,#08091020 100%)}
.hero-content{position:relative;z-index:1;padding:35px 5%;max-width:780px}
.eyebrow{color:#ff6470;font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:11px;margin-bottom:10px}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;line-height:1.08;margin-bottom:12px}
.hero p{color:#d0d3dc;font-size:14px;line-height:1.55;max-width:650px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:18px}
.primary{background:var(--red);border:0;color:white;border-radius:24px;padding:12px 22px;font-weight:800;cursor:pointer}
nav{display:flex;gap:9px;overflow-x:auto;padding:0 5% 22px;scrollbar-width:thin}
.cat{white-space:nowrap;background:#131522;color:#b6bbca;border:1px solid #ffffff12;border-radius:22px;padding:9px 16px;font-weight:700;cursor:pointer}
.cat.active,.cat:hover{background:var(--red);color:white;border-color:var(--red)}
main{max-width:1400px;margin:auto;padding:0 5% 40px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}
.section-head h2{font-size:21px;border-left:4px solid var(--red);padding-left:12px}
.status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid #ffffff0d;border-radius:11px;overflow:hidden;cursor:pointer;transition:.2s;min-width:0}
.card:hover{transform:translateY(-5px);border-color:#e5091466;box-shadow:0 12px 25px #0006}
.poster-wrap{height:260px;position:relative;background:#191c2a}
.poster{width:100%;height:100%;object-fit:cover;display:block}
.type{position:absolute;top:9px;left:9px;background:#e50914;color:#fff;font-size:10px;font-weight:800;padding:5px 7px;border-radius:4px}
.card-info{padding:12px}
.card-title{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}
.rating{color:var(--gold);font-weight:800}
.loading,.empty{grid-column:1/-1;text-align:center;padding:55px 15px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:50;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.dialog{width:min(900px,100%);max-height:92vh;overflow:auto;background:#10121d;border:1px solid #ffffff20;border-radius:14px;position:relative}
.close{position:absolute;right:12px;top:8px;z-index:3;background:#0009;border:0;color:#fff;font-size:28px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.modal-tabs{display:flex;gap:8px;padding:15px 60px 12px 15px;overflow:auto}
.tab{background:#202333;color:#c3c7d3;border:0;border-radius:7px;padding:10px 14px;white-space:nowrap;font-weight:750;cursor:pointer}
.tab.active{background:var(--red);color:white}
.video{aspect-ratio:16/9;background:#000}
.video iframe{width:100%;height:100%;border:0}
.details{padding:18px}.details h2{font-size:21px;margin-bottom:9px}.details p{color:#b5bbca;font-size:13px;line-height:1.6}
.selectors{display:none;gap:10px;padding:0 18px 14px;flex-wrap:wrap}
.selectors select{background:#202333;color:#fff;border:1px solid #ffffff22;padding:8px;border-radius:6px}
footer{text-align:center;padding:30px 15px;color:#747b8e;border-top:1px solid #ffffff10;font-size:12px}
@media(max-width:600px){header{height:62px;padding:0 4%}.logo{font-size:21px}.hero{height:390px}.hero-content{padding:25px 5%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.poster-wrap{height:245px}main{padding-left:4%;padding-right:4%}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="location.reload()">🍿 NB<span>Box</span></div>
  <input class="search" id="search" type="search" placeholder="Search movies & series..." aria-label="Search">
</header>
<section class="hero" id="hero">
  <div class="hero-content">
    <div class="eyebrow">Featured spotlight</div>
    <h1 id="hero-title">Discover something great</h1>
    <p id="hero-desc">Explore trending movies and series from TMDB.</p>
    <button class="primary" id="hero-watch">▶ View details</button>
  </div>
</section>
<nav id="categories" aria-label="Movie categories">
  <button class="cat active" data-key="all">🌐 Trending</button>
  <button class="cat" data-key="bangla">🇧🇩 Bangla</button>
  <button class="cat" data-key="hindi">🇮🇳 Hindi</button>
  <button class="cat" data-key="english">🇺🇸 English</button>
  <button class="cat" data-key="anime">🇯🇵 Anime</button>
  <button class="cat" data-key="china">🇨🇳 Chinese</button>
  <button class="cat" data-key="series">📺 TV Series</button>
  <button class="cat" data-key="popular">🔥 Popular</button>
  <button class="cat" data-key="top">⭐ Top Rated</button>
</nav>
<main>
  <div class="section-head"><h2 id="section-title">Trending Discoveries</h2><span class="status" id="status">Loading...</span></div>
  <div class="grid" id="grid"><div class="loading">Loading titles from TMDB…</div></div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Title details">
  <div class="dialog">
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="modal-tabs">
      <button class="tab active" data-source="trailer">🎬 Official trailer</button>
      <button class="tab" data-source="server1">Server 1</button>
      <button class="tab" data-source="server2">Server 2</button>
    </div>
    <div class="selectors" id="selectors">
      <label>Season <select id="season"></select></label>
      <label>Episode <select id="episode"></select></label>
    </div>
    <div class="video"><iframe id="frame" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="details"><h2 id="detail-title"></h2><p id="detail-desc"></p></div>
  </div>
</div>
<footer>© 2026 NBBox. Movie metadata and images provided by TMDB. Not endorsed or certified by TMDB.</footer>
<script>
/* Add your TMDB v3 API key below. Keep it private by using a server-side proxy for a public deployment. */
const TMDB_API_KEY = "855749dfb422b9fa4677b5321414418b";
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";
const BACKDROP = "https://image.tmdb.org/t/p/original";
const paths = {
  all:"/trending/all/week",
  bangla:"/discover/movie?with_original_language=bn&sort_by=popularity.desc",
  hindi:"/discover/movie?with_original_language=hi&sort_by=popularity.desc",
  english:"/discover/movie?with_original_language=en&sort_by=popularity.desc",
  anime:"/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc",
  china:"/discover/movie?with_original_language=zh&sort_by=popularity.desc",
  series:"/tv/popular",
  popular:"/movie/popular",
  top:"/movie/top_rated"
};
let currentItems=[], selected=null, source="trailer", currentType="movie", activeCategory="all";
const $=id=>document.getElementById(id);
function safeImage(path,size=IMG){return path?size+path:"https://placehold.co/360x540/171a28/ffffff?text=No+Poster"}
function titleOf(item){return item.title||item.name||"Untitled"}
function typeOf(item){return item.media_type|| (item.first_air_date?"tv":"movie")}
function dateOf(item){return item.release_date||item.first_air_date||""}
function apiUrl(path){const join=path.includes("?")?"&":"?";return `${API}${path}${join}api_key=${encodeURIComponent(TMDB_API_KEY)}`}
async function loadCategory(key){
  activeCategory=key;
  document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
  $("section-title").textContent=({all:"Trending Discoveries",bangla:"Bangla Movies",hindi:"Hindi Movies",english:"English Movies",anime:"Japanese Anime",china:"Chinese Movies",series:"Popular TV Series",popular:"Popular Movies",top:"Top Rated Movies"})[key]||"Discover";
  await fetchAndRender(paths[key]);
}
async function fetchAndRender(path){
  $("grid").innerHTML='<div class="loading">Loading titles from TMDB…</div>';
  $("status").textContent="Connecting to TMDB";
  if(!TMDB_API_KEY || TMDB_API_KEY==="855749dfb422b9fa4677b5321414418b"){
    $("grid").innerHTML='<div class="empty">TMDB API key is missing. Add your key in the script at TMDB_API_KEY.</div>';
    $("status").textContent="API key required";return;
  }
  try{
    const response=await fetch(apiUrl(path));
    const data=await response.json();
    if(!response.ok)throw new Error(data.status_message||`HTTP ${response.status}`);
    currentItems=data.results||[];
    render(currentItems);
    $("status").textContent=`${currentItems.length} titles`;
    if(activeCategory==="all"&&currentItems.length) setSpotlight(currentItems[0]);
  }catch(err){
    console.error("TMDB request failed:",err);
    $("grid").innerHTML=`<div class="empty">Could not load TMDB data: ${escapeHtml(err.message)}<br>Check your API key and connection.</div>`;
    $("status").textContent="Loading failed";
  }
}
function render(items){
  const grid=$("grid");grid.innerHTML="";
  if(!items.length){grid.innerHTML='<div class="empty">No titles found.</div>';return}
  items.forEach(item=>{
    const card=document.createElement("article");card.className="card";card.tabIndex=0;
    const kind=typeOf(item), label=kind==="tv"?"Series":"Movie";
    const year=dateOf(item).slice(0,4)||"—";
    const rating=Number(item.vote_average||0).toFixed(1);
    const wrap=document.createElement("div");wrap.className="poster-wrap";
    const img=document.createElement("img");img.className="poster";img.loading="lazy";img.alt=titleOf(item);img.src=safeImage(item.poster_path);
    img.onerror=()=>{img.onerror=null;img.src="https://placehold.co/360x540/171a28/ffffff?text=No+Poster"};
    const badge=document.createElement("span");badge.className="type";badge.textContent=label;
    wrap.append(img,badge);
    const info=document.createElement("div");info.className="card-info";
    const name=document.createElement("div");name.className="card-title";name.textContent=titleOf(item);name.title=titleOf(item);
    const meta=document.createElement("div");meta.className="meta";
    const date=document.createElement("span");date.textContent=year;
    const score=document.createElement("span");score.className="rating";score.textContent="★ "+rating;
    meta.append(date,score);info.append(name,meta);card.append(wrap,info);
    card.addEventListener("click",()=>openDetails(item));
    card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDetails(item)}});
    grid.appendChild(card);
  });
}
function setSpotlight(item){
  $("hero-title").textContent=titleOf(item);
  $("hero-desc").textContent=item.overview||"Explore this featured title.";
  $("hero").style.backgroundImage=item.backdrop_path?`url("${BACKDROP+item.backdrop_path}")`:"none";
  $("hero-watch").onclick=()=>openDetails(item);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function openDetails(item){
  selected=item;currentType=typeOf(item);source="trailer";
  $("detail-title").textContent=titleOf(item);
  $("detail-desc").textContent=item.overview||"No description available.";
  $("modal").classList.add("open");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.source==="trailer"));
  $("selectors").style.display=currentType==="tv"?"flex":"none";
  $("frame").src="";
  if(currentType==="tv")await loadSeasons(item.id);
  await playSource();
}
async function loadSeasons(id){
  const season=$("season");season.innerHTML="";
  try{
    const r=await fetch(apiUrl(`/tv/${id}`));const d=await r.json();
    (d.seasons||[]).filter(s=>s.season_number>0).forEach(s=>{
      const opt=document.createElement("option");opt.value=s.season_number;opt.textContent=`Season ${s.season_number}`;season.appendChild(opt);
    });
    if(!season.options.length){const opt=document.createElement("option");opt.value="1";opt.textContent="Season 1";season.appendChild(opt)}
    await loadEpisodes();
  }catch(e){console.error(e)}
}
async function loadEpisodes(){
  const id=selected?.id;if(!id)return;
  const season=$("season").value||1, episode=$("episode");episode.innerHTML="";
  try{
    const r=await fetch(apiUrl(`/tv/${id}/season/${season}`));const d=await r.json();
    (d.episodes||[]).forEach(ep=>{const opt=document.createElement("option");opt.value=ep.episode_number;opt.textContent=`Episode ${ep.episode_number}: ${ep.name||"Episode"}`;episode.appendChild(opt)});
    if(!episode.options.length){const opt=document.createElement("option");opt.value="1";opt.textContent="Episode 1";episode.appendChild(opt)}
  }catch(e){console.error(e)}
}
async function playSource(){
  if(!selected)return;
  const id=selected.id,frame=$("frame");
  if(source==="trailer"){
    frame.src="";
    try{
      const r=await fetch(apiUrl(`/${currentType}/${id}/videos`));const d=await r.json();
      const videos=d.results||[];
      const video=videos.find(v=>v.site==="YouTube"&&v.type==="Trailer")||videos.find(v=>v.site==="YouTube");
      if(video)frame.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(video.key)}?autoplay=1&rel=0`;
    }catch(e){console.error("Trailer load error",e)}
  }else{
    const s=$("season").value||1,e=$("episode").value||1;
    if(currentType==="tv"){
      frame.src=source==="server1"?`https://vidsrc.to/embed/tv/${id}/${s}/${e}`:`https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;
    }else{
      frame.src=source==="server1"?`https://vidsrc.to/embed/movie/${id}`:`https://vidsrc.cc/v2/embed/movie/${id}`;
    }
  }
}
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>loadCategory(b.dataset.key)));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{source=b.dataset.source;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));playSource()}));
$("season").addEventListener("change",async()=>{await loadEpisodes();if(source!=="trailer")playSource()});
$("episode").addEventListener("change",()=>{if(source!=="trailer")playSource()});
$("close").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function closeModal(){$("modal").classList.remove("open");$("frame").src="";selected=null}
let searchTimer;
$("search").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  const q=$("search").value.trim();
  searchTimer=setTimeout(async()=>{
    if(!q){loadCategory(activeCategory);return}
    if(!TMDB_API_KEY||TMDB_API_KEY==="855749dfb422b9fa4677b5321414418b")return;
    $("section-title").textContent=`Search: ${q}`;
    $("grid").innerHTML='<div class="loading">Searching…</div>';
    try{
      const r=await fetch(apiUrl(`/search/multi?query=${encodeURIComponent(q)}&include_adult=false`));const d=await r.json();
      currentItems=(d.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv");render(currentItems);$("status").textContent=`${currentItems.length} results`;
    }catch(e){$("grid").innerHTML='<div class="empty">Search failed. Try again.</div>'}
  },350);
});
loadCategory("all");
</script>
</body>
</html>
