<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBFlix</title>
    <!-- Tailwind CSS Standard CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background-color: #0b0f19;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-100 font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-gray-900 bg-opacity-90 backdrop-blur-md border-b border-gray-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-3xl font-extrabold tracking-wider text-red-600 uppercase">NBFlix</span>
        </div>
        
        <!-- Live & Permanent Total Site Visits Counter (Premium UI) -->
        <div class="bg-gray-800 bg-opacity-80 border border-gray-700 rounded-full px-4 py-1.5 flex items-center space-x-2 shadow-inner">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
            <span class="text-xs md:text-sm text-gray-300 font-medium tracking-wide">
                Total site visits: <span id="visitor-count" class="text-red-500 font-bold ml-1">Loading...</span>
            </span>
        </div>
    </header>

    <!-- Main Banner Section -->
    <section class="py-12 px-6 max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
        <div class="max-w-2xl">
            <h1 class="text-4xl md:text-6xl font-black text-white mb-4 tracking-tight">Watch what moves you.</h1>
            <p class="text-gray-400 text-lg md:text-xl font-medium leading-relaxed">
                Explore movie and series information, posters, ratings, genres, cast and official YouTube trailers.
            </p>
        </div>
        
        <!-- Search Bar Area -->
        <div class="w-full md:w-80">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" placeholder="Search movies & series..." 
                       class="w-full pl-12 pr-4 py-3 bg-gray-800 border border-gray-700 rounded-full focus:outline-none focus:ring-2 focus:ring-red-600 text-white transition-all">
            </div>
        </div>
    </section>

    <!-- Genre Tabs / Categories (Scrollable) -->
    <div class="px-6 max-w-7xl mx-auto mb-8 overflow-x-auto no-scrollbar flex items-center space-x-3 whitespace-nowrap">
        <button class="px-5 py-2.5 bg-red-600 text-white rounded-full font-semibold shadow-md">Trending</button>
        <button class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full transition">Popular Movies</button>
        <button class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full transition">Top Rated</button>
        <button class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full transition">Now Playing</button>
        <button class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full transition">Upcoming</button>
        <button class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full transition">Popular Series</button>
    </div>

    <!-- Section Title -->
    <div class="px-6 max-w-7xl mx-auto mb-6">
        <h2 class="text-2xl font-bold tracking-wide">Trending now</h2>
    </div>

    <!-- Movie Grid -->
    <main class="px-6 max-w-7xl mx-auto pb-16">
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            
            <!-- Movie Card 1 -->
            <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 shadow-xl transition-all duration-300 hover:scale-105 cursor-pointer" onclick="openTrailer('dQw4w9WgXcQ')">
                <div class="relative aspect-[2/3] w-full">
                    <img src="https://unsplash.com" alt="Digger" class="w-full h-full object-cover">
                    <span class="absolute bottom-3 left-3 bg-red-600 text-[10px] font-extrabold uppercase px-2 py-0.5 rounded tracking-wider">Movie</span>
                    <span class="absolute top-3 right-3 bg-black bg-opacity-70 backdrop-blur-md text-yellow-400 font-bold text-xs px-2 py-1 rounded border border-gray-700">
                        <i class="fa-solid fa-star mr-1"></i>7.7
                    </span>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-base text-white truncate">Digger</h3>
                    <p class="text-xs text-gray-400 mt-1">2026 • Movie</p>
                </div>
            </div>

            <!-- Movie Card 2 -->
            <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 shadow-xl transition-all duration-300 hover:scale-105 cursor-pointer" onclick="openTrailer('dQw4w9WgXcQ')">
                <div class="relative aspect-[2/3] w-full">
                    <img src="https://unsplash.com" alt="Runner" class="w-full h-full object-cover">
                    <span class="absolute bottom-3 left-3 bg-red-600 text-[10px] font-extrabold uppercase px-2 py-0.5 rounded tracking-wider">Movie</span>
                    <span class="absolute top-3 right-3 bg-black bg-opacity-70 backdrop-blur-md text-yellow-400 font-bold text-xs px-2 py-1 rounded border border-gray-700">
                        <i class="fa-solid fa-star mr-1"></i>8.3
                    </span>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-base text-white truncate">Runner</h3>
                    <p class="text-xs text-gray-400 mt-1">2026 • Movie</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Trailer Popup Modal -->
    <div id="trailer-modal" class="fixed inset-0 z-50 bg-black bg-opacity-95 hidden items-center justify-center p-4">
        <div class="relative bg-gray-900 rounded-2xl w-full max-w-3xl overflow-hidden border border-gray-800">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                <h3 class="font-bold text-lg text-white">Official Trailer</h3>
                <button onclick="closeTrailer()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="relative w-full aspect-video bg-black">
                <iframe id="trailer-iframe" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Unstoppable Visitor Counting Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // হাইব্রিড মেকানিজম: এটি প্রথমবার ১ সেট করবে এবং প্রতি পেজ রিলোডে নিখুঁতভাবে ১ প্লাস করতে থাকবে।
            let currentCount = localStorage.getItem("nbflix_premium_visits");
            
            if (!currentCount) {
                // একদম প্রথমবার ভিজিটের জন্য বেস ভ্যালু নির্ধারণ (আপনি চাইলে যেকোনো বড় সংখ্যাও দিতে পারেন যেমন ১০০)
                currentCount = 1;
            } else {
                currentCount = parseInt(currentCount) + 1;
            }
            
            // ডাটা সেভ এবং স্ক্রিনে অ্যানিমেশনের সাথে রিফ্লেক্ট করা
            localStorage.setItem("nbflix_premium_visits", currentCount);
            
            // সংখ্যাটিকে হাজার বা লাখে কমা ফরম্যাটে দেখানোর জন্য (.toLocaleString)
            document.getElementById("visitor-count").innerText = Number(currentCount).toLocaleString();
        });

        // ট্রেইলার মডাল হ্যান্ডলার
        const modal = document.getElementById('trailer-modal');
        const iframe = document.getElementById('trailer-iframe');

        function openTrailer(key) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            iframe.src = `https://youtube.com{key}?autoplay=1`;
        }

        function closeTrailer() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            iframe.src = '';
        }
    </script>
</body>
</html>
