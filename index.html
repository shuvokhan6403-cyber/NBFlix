<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBFlix</title><style>
:root{--bg:#07080d;--panel:#10121a;--text:#f7f8fb;--muted:#9ba1b2;--accent:#ff315c;--line:#242838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.nav{min-height:70px;display:flex;align-items:center;padding:12px 6%;gap:20px;background:#10121a;position:sticky;top:0;z-index:3;flex-wrap:wrap}.logo{font-size:25px;font-weight:900}.logo b{color:var(--accent)}input{margin-left:auto;background:#151823;border:1px solid var(--line);border-radius:999px;padding:11px;color:white;width:230px}.hero{padding:65px 6%;min-height:310px;background:radial-gradient(circle at 75% 20%,#652033,#07080d 65%)}h1{font-size:clamp(38px,6vw,68px);margin:10px 0}.wrap{padding:30px 6%}.tabs{display:flex;gap:9px;overflow:auto;padding:5px 0 20px}.tabs button,.more{background:#171a25;color:#eee;border:1px solid var(--line);border-radius:999px;padding:10px 16px;white-space:nowrap;cursor:pointer}.tabs button.active,.more{background:var(--accent);border-color:var(--accent)}.head{margin-bottom:18px;font-size:22px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid #242838;border-radius:13px;overflow:hidden;min-width:0}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#202334}.body{padding:12px}.title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:5px}.status{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px}.actions{text-align:center;padding:24px}.more:disabled{opacity:.5;cursor:default}@media(max-width:950px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}input{width:100%;margin-left:0}.nav{gap:12px}.wrap{padding:24px 4%}}
</style></head><body><nav class="nav"><div class="logo">NB<b>Flix</b></div><input id="search" placeholder="Search movies & series…" aria-label="Search movies and series"></nav><section class="hero"><div style="color:#ff8aa1;font-weight:bold">NBFLIX</div><h1>Watch what moves you.</h1><p>Explore movie and series information, posters and ratings.</p></section><main class="wrap"><div class="tabs" id="tabs"><button class="active" data-key="trending">Trending</button><button data-key="popular">Popular Movies</button><button data-key="top">Top Rated</button><button data-key="now">Now Playing</button><button data-key="upcoming">Upcoming</button><button data-key="tv">Popular Series</button><button data-key="hindi">Hindi</button><button data-key="chinese">Chinese</button><button data-key="korean">Korean</button><button data-key="japanese">Japanese</button><button data-key="anime">Anime</button><button data-key="bangla">Bangla</button></div><div class="head" id="heading">Trending now</div><div class="grid" id="grid"><div class="status">Loading titles…</div></div><div class="actions"><button class="more" id="more">Load more</button></div></main><footer style="padding:25px 6%;color:#888">© 2026 NBFlix • Movie information and images by TMDB. Not endorsed or certified by TMDB.</footer><script>
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),heading=document.querySelector('#heading'),more=document.querySelector('#more'),tabs=document.querySelector('#tabs');let titles=[],page=1,active='trending',busy=false,query='';const base='https://image.tmdb.org/t/p/w500';const configs={trending:{label:'Trending now',path:'/trending/all/week',filter:true},popular:{label:'Popular Movies',path:'/movie/popular'},top:{label:'Top Rated Movies',path:'/movie/top_rated'},now:{label:'Now Playing',path:'/movie/now_playing'},upcoming:{label:'Upcoming Movies',path:'/movie/upcoming'},tv:{label:'Popular Series',path:'/tv/popular'},hindi:{label:'Hindi Movies',path:'/discover/movie?with_original_language=hi&sort_by=popularity.desc'},chinese:{label:'Chinese Movies',path:'/discover/movie?with_original_language=zh&sort_by=popularity.desc'},korean:{label:'Korean Movies',path:'/discover/movie?with_original_language=ko&sort_by=popularity.desc'},japanese:{label:'Japanese Movies',path:'/discover/movie?with_original_language=ja&sort_by=popularity.desc'},anime:{label:'Japanese Anime',path:'/discover/movie?with_genres=16&with_original_language=ja&sort_by=popularity.desc'},bangla:{label:'Bangla Movies',path:'/discover/movie?with_original_language=bn&sort_by=popularity.desc'}};function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function draw(arr,append=false){if(!append)grid.innerHTML='';if(!arr.length&&!append){grid.innerHTML='<div class="status">No titles found.</div>';return;}arr.forEach(x=>{let n=x.title||x.name||'Untitled',yr=(x.release_date||x.first_air_date||'').slice(0,4),kind=x.media_type==='tv'||active==='tv'?'Series':'Movie',c=document.createElement('article');c.className='card';c.innerHTML=(x.poster_path?`<img class="poster" loading="lazy" alt="${safe(n)} poster" src="${base+x.poster_path}">`:'<div class="poster"></div>')+`<div class="body"><div class="title" title="${safe(n)}">${safe(n)}</div><div class="sub">${safe([yr,kind,x.vote_average?'★ '+Number(x.vote_average).toFixed(1):''].filter(Boolean).join(' • '))}</div></div>`;grid.appendChild(c);});}async function load(reset=true){if(busy)return;busy=true;more.disabled=true;if(reset){page=1;titles=[];grid.innerHTML='<div class="status">Loading titles…</div>';}const cfg=configs[active];try{const endpoint=cfg.path+(cfg.path.includes('?')?'&':'?')+'page='+page;let r=await fetch('/.netlify/functions/tmdb?endpoint='+encodeURIComponent(endpoint));if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),results=(d.results||[]).filter(x=>!cfg.filter||['movie','tv'].includes(x.media_type));titles=reset?results:titles.concat(results);showFiltered();more.style.display=(d.total_pages&&page<d.total_pages)?'inline-block':'none';}catch(e){if(reset)grid.innerHTML='<div class="status">Could not load titles. Check the Netlify function and TMDB_API_KEY, then redeploy.</div>';console.error(e);}finally{busy=false;more.disabled=false;}}function showFiltered(){const q=query.toLowerCase().trim();draw(q?titles.filter(x=>(x.title||x.name||'').toLowerCase().includes(q)):titles);}tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(!b)return;active=b.dataset.key;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));heading.textContent=configs[active].label;load(true);});search.addEventListener('input',()=>{query=search.value;showFiltered();});more.addEventListener('click',()=>{page++;load(false);});load();
</script></body></html>
