<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBFlix</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 60px;
        }
        
        /* Navbar */
        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #dc2626;
            text-transform: uppercase;
        }
        
        /* Premium Counter UI */
        .counter-box {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 9999px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }
        .counter-text {
            font-size: 13px;
            color: #d1d5db;
            font-weight: 500;
        }
        .counter-num {
            color: #dc2626;
            font-weight: 700;
            margin-left: 4px;
        }

        /* Hero Banner Section */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        @media (min-width: 768px) {
            .hero {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }
        .hero-title {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        .hero-p {
            color: #9ca3af;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            width: 100%;
        }
        @media (min-width: 768px) {
            .search-container { width: 320px; }
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 9999px;
            color: white;
            outline: none;
            transition: 0.2s;
        }
        .search-input:focus {
            border-color: #dc2626;
        }

        /* Category Tabs */
        .categories-nav {
            max-width: 1200px;
            margin: 0 auto 32px auto;
            padding: 0 24px;
            overflow-x: auto;
            display: flex;
            gap: 12px;
            white-space: nowrap;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-active {
            background-color: #dc2626;
            color: white;
        }
        .tab-inactive {
            background-color: #1f2937;
            color: #d1d5db;
        }
        .tab-inactive:hover {
            background-color: #374151;
        }

        /* Movie Section Title */
        .section-title {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            padding: 0 24px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Fixed Movie Grid (স্থায়ী লেআউট) */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }
        @media (min-width: 640px) { .grid-container { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .grid-container { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

        .movie-card {
            background-color: #111827;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1f2937;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            background-color: #1f2937;
        }
        .movie-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background-color: #dc2626;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .rating-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            font-size: 12px;
            font-weight: 700;
            color: #fbbf24;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #374151;
        }
        .movie-info {
            padding: 16px;
        }
        .movie-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Loading UI text */
        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-size: 18px;
        }

        /* Modal Popup */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-content {
            background-color: #111827;
            border-radius: 16px;
            width: 100%;
            max-width: 768px;
            overflow: hidden;
            border: 1px solid #1f2937;
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }
        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 20px;
        }
        .close-btn:hover { color: white; }
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: black;
        }
        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">NBFlix</div>
        
        <!-- Live & Permanent Total Site Visits Counter -->
        <div class="counter-box">
            <span class="live-dot"></span>
            <div class="counter-text">
                Total site visits:<span id="visitor-count" class="counter-num">1</span>
            </div>
        </div>
    </header>

    <!-- Main Banner Section -->
    <section class="hero">
        <div>
            <h1 class="hero-title">Watch what moves you.</h1>
            <p class="hero-p">
                Explore movie and series information, posters, ratings, genres, cast and official YouTube trailers.
            </p>
        </div>
        
        <!-- Search Bar Area -->
        <div class="search-container">
            <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="search-input" placeholder="Search movies & series..." class="search-input">
        </div>
    </section>

    <!-- Genre Tabs / Categories -->
    <div class="categories-nav">
        <button class="tab-btn tab-active" onclick="fetchMovies('trending')">Trending</button>
        <button class="tab-btn tab-inactive" onclick="fetchMovies('popular')">Popular Movies</button>
        <button class="tab-btn tab-inactive" onclick="fetchMovies('top_rated')">Top Rated</button>
        <button class="tab-btn tab-inactive" onclick="fetchMovies('now_playing')">Now Playing</button>
