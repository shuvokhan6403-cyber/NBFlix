<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<meta name="description" content="NBFlix — Movies & Series">
<title>NBFlix — Movies & Series</title>

<style>
:root{
  --bg:#07080d;
  --panel:#10121a;
  --panel2:#151823;
  --text:#f7f7fa;
  --muted:#9298a8;
  --accent:#ff315c;
  --green:#29d391;
  --border:#242837;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.nav{
  position:sticky;
  top:0;
  z-index:50;
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
  background:rgba(7,8,13,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo{
  font-size:23px;
  font-weight:900;
  white-space:nowrap;
}
.logo span{color:var(--accent)}
.search{
  flex:1;
  max-width:560px;
  margin:auto;
  position:relative;
}
.search input{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:25px;
  outline:0;
  color:#fff;
  background:#11131b;
}
.adminBtn{
  border:0;
  background:var(--accent);
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:800;
}
.hero{
  min-height:300px;
  padding:50px 20px 35px;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 75% 30%,rgba(255,49,92,.2),transparent 35%),
    linear-gradient(180deg,#11131d,#07080d);
}
.heroInner{
  width:min(1150px,100%);
  margin:auto;
}
.hero h1{
  font-size:clamp(36px,7vw,70px);
  margin:0 0 10px;
  line-height:1;
}
.hero p{
  max-width:650px;
  color:var(--muted);
  font-size:16px;
}
.stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}
.stat{
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#10121a;
  color:#ddd;
}
.tabs{
  position:sticky;
  top:64px;
  z-index:40;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 15px;
  background:rgba(7,8,13,.96);
  border-bottom:1px solid var(--border);
}
.tabs button{
  white-space:nowrap;
  border:1px solid var(--border);
  color:#bbb;
  background:#10121a;
  padding:9px 13px;
  border-radius:20px;
}
.tabs button.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}
.wrap{
  width:min(1200px,100%);
  margin:auto;
  padding:22px 15px 60px;
}
.sectionHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:18px;
}
.sectionHead h2{margin:0}
.count{color:var(--muted);font-size:13px}
.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:15px;
}
.card{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  transition:.2s;
}
.card:hover{
  transform:translateY(-3px);
  border-color:#3a3f50;
}
.poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
  background:#161923;
}
.cardBody{padding:10px}
.title{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}
.rating{color:#ffd15c}
.views{
  color:#aaa;
  font-size:12px;
  margin-top:7px;
}
.watchSmall{
  display:none;
  margin-top:9px;
  width:100%;
  padding:8px;
  background:var(--accent);
  color:#fff;
  border:0;
  border-radius:8px;
}
.hasLink .watchSmall{display:block}
.loader{
  padding:35px;
  text-align:center;
  color:var(--muted);
}
.adslot{
  width:min(1100px,calc(100% - 30px));
  margin:15px auto;
}
.adbox{
  overflow:hidden;
  border-radius:10px;
}
.adbox img{
  display:block;
  width:100%;
  max-height:300px;
  object-fit:cover;
}
.adHtml{width:100%;overflow:hidden}
footer{
  border-top:1px solid var(--border);
  padding:30px 15px;
  text-align:center;
  color:#777;
  font-size:12px;
}

/* modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.82);
  padding:20px;
  overflow:auto;
}
.modal.show{display:block}
.modalBox{
  width:min(850px,100%);
  margin:30px auto;
  background:#10121a;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}
.close{
  position:absolute;
  right:20px;
  top:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:22px;
}
.modalVideo{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.modalVideo iframe{
  width:100%;
  height:100%;
  border:0;
}
.modalContent{padding:20px}
.modalContent h2{margin-top:0}
.overview{color:#b5bac7;line-height:1.6}

  background:var(--accent);
